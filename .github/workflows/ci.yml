name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: "3.11"
                    - os: ubuntu-latest
                      python-version: "3.12"
                    - os: ubuntu-latest
                      python-version: "3.13"
                    - os: windows-latest
                      python-version: "3.13"

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install package
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]"

            - name: Ruff lint
              run: python -m ruff check .

            - name: Ruff format
              run: python -m ruff format --check .

            - name: Pytest
              run: python -m pytest

            - name: Build package
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
              run: python -m build
